# Server port (default 8080).
server.port=8080

# PostgreSQL (override with SPRING_DATASOURCE_* env vars; defaults match a typical local Docker Compose setup).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nyc_transit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nyc}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nyc}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
