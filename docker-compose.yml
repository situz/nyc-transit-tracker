services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nyc_transit}
      POSTGRES_USER: ${POSTGRES_USER:-nyc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nyc}
    ports:
      - "5432:5432"
    volumes:
      - nyc_transit_pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      MTA_API_KEY: ${MTA_API_KEY}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nyc_transit}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nyc}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-nyc}
    depends_on:
      - postgres

volumes:
  nyc_transit_pgdata:
